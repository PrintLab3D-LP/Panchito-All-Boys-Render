<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panchito · Administración</title>
<style>
:root{--blue:#123b78;--yellow:#f5c400;--bg:#f3f6fb;--card:#fff;--text:#172033;--muted:#667085;--danger:#b42318;--ok:#067647}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--text)}
header{background:var(--blue);color:white;padding:18px 24px;border-bottom:6px solid var(--yellow);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:21px;margin:0} header small{opacity:.85}.wrap{max-width:1200px;margin:22px auto;padding:0 16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat,.card{background:var(--card);border-radius:14px;box-shadow:0 4px 18px #102a4312;border:1px solid #e6eaf0}.stat{padding:16px}.stat b{display:block;font-size:26px;color:var(--blue)}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:15px 0}.toolbar input{max-width:360px;width:100%;padding:11px;border:1px solid #ccd3df;border-radius:10px}.toolbar button,.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn-primary{background:var(--blue);color:white}.btn-yellow{background:var(--yellow);color:#172033}.btn-light{background:#eef2f7;color:#344054}.btn-danger{background:#fee4e2;color:var(--danger)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}.card{padding:16px}.top{display:flex;justify-content:space-between;gap:10px}.phone{font-weight:800;color:var(--blue)}.badge{font-size:12px;font-weight:800;padding:5px 8px;border-radius:999px;background:#fff4cc}.meta{color:var(--muted);font-size:13px;margin:8px 0}.message{background:#f7f9fc;border-radius:9px;padding:11px;white-space:pre-wrap;min-height:50px}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.empty{text-align:center;padding:48px 18px;color:var(--muted)}
section{margin-top:24px}h2{font-size:18px}.history{background:white;border-radius:14px;overflow:hidden;border:1px solid #e6eaf0}.row{display:grid;grid-template-columns:170px 1fr 1fr;gap:10px;padding:11px 14px;border-bottom:1px solid #eef1f5;font-size:13px}.row:last-child{border:0}.status{font-size:13px}.ok{color:var(--ok)}.bad{color:var(--danger)}
@media(max-width:700px){.stats{grid-template-columns:1fr}.row{grid-template-columns:1fr}.toolbar{align-items:stretch;flex-direction:column}.toolbar input{max-width:none}}
</style>
</head>
<body>
<header><div><h1>🔵🟡 Panchito · Administración</h1><small>Bandeja de conversaciones derivadas</small></div><div id="apiStatus" class="status">Comprobando DigitalClub…</div></header>
<main class="wrap">
<div class="stats"><div class="stat"><b id="waiting">0</b>Chats en modo humano</div><div class="stat"><b id="today">0</b>Derivaciones de hoy</div><div class="stat"><b id="historyCount">0</b>Movimientos registrados</div></div>
<div class="toolbar"><input id="search" placeholder="Buscar por nombre, teléfono o tema"><button class="btn-primary" onclick="loadAll()">Actualizar</button></div>
<div id="grid" class="grid"></div>
<section><h2>Últimos movimientos</h2><div id="history" class="history"></div></section>
</main>
<script>
let handoffs=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=d=>d?new Date(d).toLocaleString('es-AR'):'—';
async function api(url,opts={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Error');return j}
async function closeChat(phone){if(!confirm('¿Finalizar la atención y devolver este chat a Panchito?'))return;await api('/api/handoffs/'+encodeURIComponent(phone)+'/close',{method:'POST',body:JSON.stringify({operator:'Panel Administración'})});loadAll()}
async function keepHuman(phone){await api('/api/handoffs/'+encodeURIComponent(phone)+'/human',{method:'POST',body:JSON.stringify({operator:'Panel Administración'})});loadAll()}
function render(){const q=document.getElementById('search').value.toLowerCase();const list=handoffs.filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById('waiting').textContent=handoffs.length;document.getElementById('grid').innerHTML=list.length?list.map(x=>`<article class="card"><div class="top"><span class="phone">${esc(x.name||x.phone)}</span><span class="badge">EN ATENCIÓN HUMANA</span></div><div class="meta">📱 ${esc(x.phone)} · ${fmt(x.handoffAt)}</div><div class="meta"><b>Tema:</b> ${esc(x.topic||x.reason||'Administración')}</div><div class="message">${esc(x.message||'Sin detalle de consulta')}</div><div class="actions"><button class="btn btn-yellow" onclick="keepHuman('${esc(x.phone)}')">Tomar / mantener</button><button class="btn btn-primary" onclick="closeChat('${esc(x.phone)}')">Finalizar y devolver al bot</button></div></article>`).join(''):'<div class="card empty">No hay conversaciones esperando atención humana.</div>'}
async function loadAll(){try{const [h,hist,status]=await Promise.all([api('/api/handoffs'),api('/api/handoffs/history'),api('/api/integrations/digitalclub/status')]);handoffs=h;render();const today=new Date().toISOString().slice(0,10);document.getElementById('today').textContent=hist.filter(x=>(x.at||'').slice(0,10)===today&&['created','taken'].includes(x.action)).length;document.getElementById('historyCount').textContent=hist.length;document.getElementById('history').innerHTML=hist.slice(0,25).map(x=>`<div class="row"><span>${fmt(x.at)}</span><b>${esc(x.action)}</b><span>${esc(x.phone)} ${esc(x.operator||'')}</span></div>`).join('')||'<div class="empty">Sin movimientos todavía.</div>';document.getElementById('apiStatus').innerHTML=status.ready?'<span class="ok">● DigitalClub preparado</span>':'<span>○ DigitalClub pendiente de credenciales</span>'}catch(e){document.getElementById('grid').innerHTML='<div class="card empty bad">'+esc(e.message)+'</div>'}}
document.getElementById('search').addEventListener('input',render);loadAll();setInterval(loadAll,15000);
</script>
</body></html>
