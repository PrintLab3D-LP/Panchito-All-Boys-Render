<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ingreso · Panchito Administración</title>
<link rel="icon" type="image/png" href="/allboys-logo.png">
<style>
:root{--blue:#123b78;--yellow:#f5c400;--bg:#eef3f9;--text:#172033;--muted:#667085;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#0d2f63,#123b78 52%,#0a244d);font-family:Inter,system-ui,Arial;color:var(--text)}
.card{width:min(430px,100%);background:#fff;border-radius:20px;box-shadow:0 24px 70px #0005;overflow:hidden}.top{background:var(--blue);color:#fff;border-bottom:7px solid var(--yellow);padding:26px;text-align:center}.top img{width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 3px 7px #0005)}h1{font-size:22px;margin:12px 0 5px}.top p{margin:0;opacity:.85}.form{padding:26px}.field{margin-bottom:16px}label{display:block;font-weight:800;font-size:14px;margin-bottom:7px}input{width:100%;border:1px solid #cfd6e2;border-radius:11px;padding:13px 14px;font-size:16px;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #123b7818}button{width:100%;border:0;border-radius:11px;background:var(--yellow);color:#172033;padding:13px;font-size:16px;font-weight:900;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.error{min-height:22px;color:var(--danger);font-size:14px;margin:8px 0 12px}.note{font-size:12px;color:var(--muted);text-align:center;margin-top:15px}
</style>
</head>
<body>
<main class="card">
  <section class="top"><img src="/allboys-logo.png" alt="Escudo Club All Boys"><h1>Panchito Administración</h1><p>Centro de atención del Club All Boys</p></section>
  <form class="form" id="loginForm">
    <div class="field"><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" required autofocus></div>
    <div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <div id="error" class="error"></div>
    <button id="submit" type="submit">Ingresar</button>
    <div class="note">Acceso exclusivo para personal autorizado del club.</div>
  </form>
</main>
<script>
loginForm.addEventListener('submit',async e=>{
  e.preventDefault();error.textContent='';submit.disabled=true;submit.textContent='Ingresando…';
  try{
    const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||'No se pudo iniciar sesión');
    location.href='/admin';
  }catch(e){error.textContent=e.message;submit.disabled=false;submit.textContent='Ingresar'}
});
</script>
</body></html>
